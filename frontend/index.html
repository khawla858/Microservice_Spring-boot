<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AcadémIA — Student Enrollment</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,500;0,700;1,300&family=Geist+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --ink:    #0e0c0a;
  --paper:  #f6f3ee;
  --cream:  #ede9e1;
  --warm:   #e8e2d6;
  --rule:   #d4cec4;
  --dim:    #a09890;
  --quiet:  #c8c0b4;
  --cobalt: #1a3fd4;
  --sky:    #4a7ff5;
  --sage:   #2e7d5e;
  --clay:   #c45c3a;
  --gold:   #b5860a;
  --r:      10px;
}

html{scroll-behavior:smooth}

body{
  font-family:'Outfit',sans-serif;
  background:var(--paper);
  color:var(--ink);
  min-height:100vh;
  line-height:1.5;
  overflow-x:hidden;
}

/* ── NOISE TEXTURE overlay ─────────────────────────── */
body::before{
  content:'';
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  opacity:.6;
}

/* ── ACCENT LINE top ───────────────────────────────── */
.top-line{
  height:3px;
  background:linear-gradient(90deg,var(--cobalt) 0%,var(--sky) 40%,var(--clay) 75%,var(--gold) 100%);
  position:relative;z-index:10;
}

/* ── HEADER ────────────────────────────────────────── */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(246,243,238,.94);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1.5px solid var(--rule);
  padding:0 48px;
  height:62px;
  display:flex;align-items:center;gap:18px;
}
.brand{
  display:flex;align-items:baseline;gap:8px;
}
.brand-name{
  font-family:'Fraunces',serif;
  font-size:1.35rem;
  font-weight:700;
  letter-spacing:-.02em;
  color:var(--ink);
}
.brand-name em{
  font-style:italic;
  font-weight:300;
  color:var(--cobalt);
}
.brand-dot{
  width:7px;height:7px;
  border-radius:50%;
  background:var(--clay);
  flex-shrink:0;
  margin-bottom:2px;
}
.nav-sep{
  width:1px;height:18px;
  background:var(--rule);
  margin:0 4px;
}
.header-meta{
  font-family:'Geist Mono',monospace;
  font-size:.68rem;
  color:var(--dim);
  letter-spacing:.06em;
  text-transform:uppercase;
}
.header-right{margin-left:auto;display:flex;align-items:center;gap:12px;}
.status-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--sage);
  box-shadow:0 0 0 3px rgba(46,125,94,.18);
  animation:pulse-dot 2.5s ease infinite;
}
@keyframes pulse-dot{
  0%,100%{box-shadow:0 0 0 3px rgba(46,125,94,.18);}
  50%{box-shadow:0 0 0 6px rgba(46,125,94,.08);}
}
.status-label{
  font-size:.73rem;font-weight:500;
  color:var(--dim);
  font-family:'Geist Mono',monospace;
}

/* ── MAIN ──────────────────────────────────────────── */
main{
  position:relative;z-index:1;
  max-width:1140px;
  margin:0 auto;
  padding:52px 32px 80px;
}

/* ── SECTION LABEL ─────────────────────────────────── */
.section-eyebrow{
  display:inline-flex;align-items:center;gap:10px;
  font-family:'Geist Mono',monospace;
  font-size:.68rem;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--cobalt);
  margin-bottom:10px;
}
.section-eyebrow::before{
  content:'';
  display:inline-block;
  width:24px;height:1.5px;
  background:var(--cobalt);
}

/* ── HERO ──────────────────────────────────────────── */
.hero{
  margin-bottom:48px;
  animation:riseIn .7s cubic-bezier(.22,1,.36,1) both;
}
.hero-heading{
  font-family:'Fraunces',serif;
  font-size:clamp(2.2rem,5vw,3.2rem);
  font-weight:500;
  letter-spacing:-.04em;
  line-height:1.08;
  color:var(--ink);
  margin-bottom:16px;
}
.hero-heading em{
  font-style:italic;
  font-weight:300;
  color:var(--cobalt);
}
.hero-sub{
  font-size:.95rem;
  color:var(--dim);
  font-weight:300;
  max-width:480px;
  margin-bottom:32px;
}

/* ── SEARCH CARD ───────────────────────────────────── */
.search-card{
  background:var(--ink);
  border-radius:16px;
  padding:28px 32px;
  max-width:560px;
  display:flex;
  align-items:flex-end;
  gap:16px;
  flex-wrap:wrap;
  box-shadow:0 8px 48px rgba(14,12,10,.16),0 2px 8px rgba(14,12,10,.08);
}
.field-wrap{flex:1;min-width:180px;}
.field-label{
  font-family:'Geist Mono',monospace;
  font-size:.65rem;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--dim);
  margin-bottom:8px;
  display:block;
}
.field-input{
  width:100%;
  background:rgba(255,255,255,.07);
  border:1.5px solid rgba(255,255,255,.12);
  border-radius:9px;
  padding:12px 16px;
  color:#f0ece4;
  font-family:'Outfit',sans-serif;
  font-size:.95rem;
  outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.field-input::placeholder{color:rgba(255,255,255,.28);}
.field-input:focus{
  border-color:var(--sky);
  box-shadow:0 0 0 3px rgba(74,127,245,.22);
}
.btn-access{
  background:var(--cobalt);
  color:#fff;
  border:none;
  border-radius:9px;
  padding:12px 24px;
  font-family:'Outfit',sans-serif;
  font-size:.88rem;
  font-weight:600;
  cursor:pointer;
  transition:background .2s,transform .15s,box-shadow .2s;
  white-space:nowrap;
  letter-spacing:.01em;
  box-shadow:0 4px 20px rgba(26,63,212,.35);
}
.btn-access:hover{background:#1535bb;transform:translateY(-1px);box-shadow:0 6px 26px rgba(26,63,212,.45);}
.btn-access:active{transform:translateY(0);}

/* ── ERROR ─────────────────────────────────────────── */
#error{
  display:none;
  margin-bottom:28px;
  background:#fdf0ed;
  border:1.5px solid rgba(196,92,58,.25);
  border-left:3px solid var(--clay);
  color:#8b2f10;
  border-radius:0 10px 10px 0;
  padding:12px 18px;
  font-size:.875rem;
  font-weight:500;
  animation:riseIn .3s ease both;
}
#error.show{display:block;}

/* ── STUDENT RIBBON ────────────────────────────────── */
.ribbon{
  display:none;
  background:var(--cream);
  border:1.5px solid var(--rule);
  border-radius:12px;
  padding:16px 22px;
  margin-bottom:32px;
  align-items:center;
  gap:16px;
  flex-wrap:wrap;
  animation:riseIn .4s ease both;
}
.ribbon.show{display:flex;}
.avatar{
  width:44px;height:44px;flex-shrink:0;
  border-radius:50%;
  background:var(--cobalt);
  display:grid;place-items:center;
  font-family:'Fraunces',serif;
  font-size:1.1rem;
  font-weight:700;
  color:#fff;
  letter-spacing:-.02em;
}
.ribbon-info{flex:1;}
.ribbon-name{
  font-family:'Fraunces',serif;
  font-size:1rem;
  font-weight:500;
  color:var(--ink);
}
.ribbon-cnie{
  font-family:'Geist Mono',monospace;
  font-size:.72rem;
  color:var(--dim);
  margin-top:1px;
  letter-spacing:.04em;
}
.pills{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;}
.pill{
  font-family:'Geist Mono',monospace;
  font-size:.7rem;
  font-weight:500;
  padding:5px 13px;
  border-radius:99px;
  letter-spacing:.04em;
  border:1.5px solid;
}
.pill-blue{background:#eef3ff;color:var(--cobalt);border-color:#c4d3fb;}
.pill-green{background:#edf7f2;color:var(--sage);border-color:#b4ddc9;}

/* ── DASHBOARD ─────────────────────────────────────── */
#dashboard{display:none;}
.db-header{
  display:flex;align-items:baseline;gap:16px;
  margin-bottom:24px;
}
.db-title{
  font-family:'Fraunces',serif;
  font-size:1.5rem;
  font-weight:500;
  letter-spacing:-.03em;
  color:var(--ink);
}

/* ── TWO-COL GRID ──────────────────────────────────── */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  align-items:start;
}
@media(max-width:740px){.grid{grid-template-columns:1fr;}}

/* ── PANEL ─────────────────────────────────────────── */
.panel{
  background:#fff;
  border:1.5px solid var(--rule);
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 2px 16px rgba(14,12,10,.06);
  animation:riseIn .5s cubic-bezier(.22,1,.36,1) both;
}
.panel:nth-child(2){animation-delay:.09s;}

.panel-head{
  padding:18px 22px 14px;
  border-bottom:1.5px solid var(--warm);
  display:flex;align-items:center;gap:12px;
  background:var(--cream);
}
.panel-icon{
  width:34px;height:34px;
  border-radius:9px;
  display:grid;place-items:center;
  font-size:15px;
  flex-shrink:0;
}
.pi-blue{background:#dce9ff;}
.pi-green{background:#d4eede;}
.panel-title{
  font-family:'Fraunces',serif;
  font-size:.95rem;
  font-weight:500;
  color:var(--ink);
  letter-spacing:-.01em;
}
.panel-count{
  margin-left:auto;
  font-family:'Geist Mono',monospace;
  font-size:.7rem;
  font-weight:500;
  padding:3px 10px;
  background:var(--warm);
  border:1px solid var(--rule);
  border-radius:99px;
  color:var(--dim);
}

.panel-body{
  padding:14px;
  display:flex;flex-direction:column;gap:10px;
  min-height:80px;
}

/* ── COURSE CARD ───────────────────────────────────── */
.course-card{
  border:1.5px solid var(--warm);
  border-radius:12px;
  padding:16px 18px;
  background:var(--paper);
  transition:border-color .2s,box-shadow .22s,transform .18s;
  position:relative;
  overflow:hidden;
}
.course-card:hover{
  border-color:var(--cobalt);
  box-shadow:0 4px 24px rgba(26,63,212,.1);
  transform:translateY(-2px);
}
.course-card.is-enrolled{
  border-color:#b4ddc9;
  background:#f5fcf8;
}
.course-card.is-enrolled:hover{
  border-color:var(--sage);
  box-shadow:0 4px 20px rgba(46,125,94,.1);
}

/* left accent bar */
.course-card::after{
  content:'';
  position:absolute;
  top:0;left:0;
  width:3px;height:100%;
  background:var(--cobalt);
  transform:scaleY(0);
  transform-origin:bottom;
  transition:transform .22s ease;
  border-radius:0 2px 2px 0;
}
.course-card:hover::after{transform:scaleY(1);}
.course-card.is-enrolled::after{
  background:var(--sage);
  transform:scaleY(1);
}

.c-top{
  display:flex;align-items:flex-start;
  justify-content:space-between;gap:8px;
  margin-bottom:6px;
}
.c-name{
  font-family:'Fraunces',serif;
  font-size:.95rem;
  font-weight:500;
  color:var(--ink);
  letter-spacing:-.01em;
  line-height:1.35;
}
.tag{
  font-family:'Geist Mono',monospace;
  font-size:.65rem;
  font-weight:500;
  padding:3px 9px;
  border-radius:99px;
  white-space:nowrap;
  flex-shrink:0;
  border:1.5px solid;
}
.tag-cr   {background:#fdf6e3;color:var(--gold);border-color:#e8cc7a;}
.tag-ok   {background:#edf7f2;color:var(--sage);border-color:#b4ddc9;}
.tag-full {background:#fdf0ed;color:var(--clay);border-color:#e8b5a5;}

.c-desc{
  font-size:.78rem;
  color:var(--dim);
  margin-bottom:12px;
  line-height:1.65;
}

/* capacity */
.cap-bar-row{
  display:flex;justify-content:space-between;
  font-family:'Geist Mono',monospace;
  font-size:.68rem;
  color:var(--quiet);
  margin-bottom:5px;
}
.cap-bar-row strong{color:var(--dim);}
.cap-track{
  height:4px;background:var(--warm);
  border-radius:99px;overflow:hidden;
  margin-bottom:14px;
}
.cap-fill{
  height:100%;border-radius:99px;
  transition:width .5s ease;
}
.cf-green{background:linear-gradient(90deg,#2e7d5e,#52c99a);}
.cf-amber{background:linear-gradient(90deg,#b5860a,#e8af2c);}
.cf-red  {background:linear-gradient(90deg,#c45c3a,#e88a6e);}

/* date */
.date-tag{
  display:inline-flex;align-items:center;gap:5px;
  font-family:'Geist Mono',monospace;
  font-size:.68rem;color:var(--dim);
  background:var(--cream);
  border:1px solid var(--rule);
  padding:3px 10px;border-radius:99px;
  margin-bottom:12px;
}

/* actions */
.c-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}

.btn-enroll{
  background:var(--cobalt);
  color:#fff;border:none;
  padding:8px 18px;border-radius:8px;
  font-family:'Outfit',sans-serif;
  font-size:.8rem;font-weight:600;
  cursor:pointer;
  transition:background .2s,transform .15s;
  letter-spacing:.01em;
}
.btn-enroll:hover{background:#1535bb;transform:translateY(-1px);}

.btn-cancel{
  background:transparent;
  color:var(--clay);
  border:1.5px solid rgba(196,92,58,.3);
  padding:7px 16px;border-radius:8px;
  font-family:'Outfit',sans-serif;
  font-size:.78rem;font-weight:500;
  cursor:pointer;
  transition:background .2s,border-color .2s,transform .15s;
}
.btn-cancel:hover{
  background:#fdf0ed;
  border-color:var(--clay);
  transform:translateY(-1px);
}

.tag-full-inline{
  display:inline-flex;align-items:center;gap:5px;
  font-size:.75rem;font-weight:500;
  color:var(--clay);
  background:#fdf0ed;
  border:1.5px solid rgba(196,92,58,.22);
  padding:6px 13px;border-radius:8px;
}
.tag-expired{
  font-size:.75rem;color:var(--quiet);
  display:inline-flex;align-items:center;gap:4px;
}

/* ── EMPTY ─────────────────────────────────────────── */
.empty{
  text-align:center;
  padding:36px 20px;
  color:var(--quiet);
}
.empty-icon{
  font-size:2rem;display:block;
  margin-bottom:10px;
  filter:grayscale(20%);
}
.empty p{font-size:.84rem;line-height:1.7;color:var(--dim);}

/* ── LOADING ───────────────────────────────────────── */
.skeleton{
  background:linear-gradient(90deg,var(--cream) 0%,var(--warm) 50%,var(--cream) 100%);
  background-size:200% 100%;
  animation:shimmer 1.5s ease infinite;
  border-radius:8px;
}
@keyframes shimmer{
  0%{background-position:200% 0;}
  100%{background-position:-200% 0;}
}

/* ── ANIMATIONS ────────────────────────────────────── */
@keyframes riseIn{
  from{opacity:0;transform:translateY(20px);}
  to{opacity:1;transform:translateY(0);}
}

/* ── DIVIDER ───────────────────────────────────────── */
hr.rule{border:none;border-top:1.5px solid var(--warm);margin:0;}
</style>
</head>
<body>

<div class="top-line"></div>

<header>
  <div class="brand">
    <span class="brand-name">Académ<em>ia</em></span>
    <div class="brand-dot"></div>
  </div>
  <div class="nav-sep"></div>
  <span class="header-meta">Enrollment Portal</span>
  <div class="header-right">
    <div class="status-dot"></div>
    <span class="status-label">System Online</span>
  </div>
</header>

<main>

  <!-- ── HERO ── -->
  <div class="hero">
    <div class="section-eyebrow">Student Access</div>
    <h1 class="hero-heading">Course<br><em>Enrollment</em></h1>
    <p class="hero-sub">Enter your national ID to view available courses and manage your academic registrations.</p>

    <div class="search-card">
      <div class="field-wrap">
        <label class="field-label" for="cnie">National ID — CNIE</label>
        <input class="field-input" type="text" id="cnie"
               placeholder="e.g.  CD2387"
               autocomplete="off"
               onkeydown="if(event.key==='Enter') loadDashboard()">
      </div>
      <button class="btn-access" onclick="loadDashboard()">Access Portal →</button>
    </div>
  </div>

  <!-- ── ERROR ── -->
  <div id="error"></div>

  <!-- ── STUDENT RIBBON ── -->
  <div class="ribbon" id="ribbon">
    <div class="avatar" id="avatarLetter">?</div>
    <div class="ribbon-info">
      <div class="ribbon-name" id="ribbonName">—</div>
      <div class="ribbon-cnie" id="ribbonCnie">—</div>
    </div>
    <div class="pills">
      <span class="pill pill-blue" id="pillAvail">— available</span>
      <span class="pill pill-green" id="pillEnrolled">— enrolled</span>
    </div>
  </div>

  <!-- ── DASHBOARD ── -->
  <div id="dashboard">
    <div class="grid">

      <!-- Available Courses -->
      <div class="panel">
        <div class="panel-head">
          <div class="panel-icon pi-blue">📚</div>
          <span class="panel-title">Available Courses</span>
          <span class="panel-count" id="cntAvail">0</span>
        </div>
        <div class="panel-body" id="availableCourses"></div>
      </div>

      <!-- My Enrollments -->
      <div class="panel">
        <div class="panel-head">
          <div class="panel-icon pi-green">✓</div>
          <span class="panel-title">My Enrollments</span>
          <span class="panel-count" id="cntEnrolled">0</span>
        </div>
        <div class="panel-body" id="myEnrollments"></div>
      </div>

    </div>
  </div>

</main>

<script>
const API = "http://localhost:8080";
let currentStudent = null;

async function loadDashboard(){
  const cnie = document.getElementById("cnie").value.trim();
  if(!cnie){ showErr("Please enter your CNIE."); return; }
  hideErr();

  try{
    const sRes = await fetch(`${API}/students/by-cnie/${cnie}`);
    if(!sRes.ok) throw new Error(`No student found with CNIE: ${cnie}`);
    currentStudent = await sRes.json();

    const [cRes, eRes] = await Promise.all([
      fetch(`${API}/courses`),
      fetch(`${API}/enrollments/student/${currentStudent.id}`)
    ]);
    const allCourses    = await cRes.json();
    const myEnrollments = await eRes.json();

    await displayAvailableCourses(allCourses, myEnrollments);
    displayMyEnrollments(myEnrollments);
    updateRibbon(myEnrollments, allCourses);

    document.getElementById("dashboard").style.display = "block";
  }catch(err){
    showErr("⚠  " + err.message);
    document.getElementById("dashboard").style.display = "none";
    document.getElementById("ribbon").className = "ribbon";
  }
}

function updateRibbon(enrollments, allCourses){
  const name = currentStudent.name || currentStudent.firstName || currentStudent.username || "Student";
  const cnie = currentStudent.cnie || "";
  const myCourseIds = enrollments.map(e=>e.courseId);
  const avail = allCourses.filter(c=>!myCourseIds.includes(c.id)).length;

  document.getElementById("avatarLetter").textContent = name.charAt(0).toUpperCase();
  document.getElementById("ribbonName").textContent   = name;
  document.getElementById("ribbonCnie").textContent   = cnie ? "CNIE: " + cnie : "";
  document.getElementById("pillAvail").textContent    = avail + " available";
  document.getElementById("pillEnrolled").textContent = enrollments.length + " enrolled";
  document.getElementById("ribbon").className = "ribbon show";
}

async function displayAvailableCourses(allCourses, myEnrollments){
  const container = document.getElementById("availableCourses");
  container.innerHTML = `<div class="skeleton" style="height:80px"></div>`;

  const myCourseIds = myEnrollments.map(e=>e.courseId);
  const available   = allCourses.filter(c=>!myCourseIds.includes(c.id));
  document.getElementById("cntAvail").textContent = available.length;
  container.innerHTML = "";

  if(available.length === 0){
    container.innerHTML = `<div class="empty"><span class="empty-icon">✨</span><p>Enrolled in all available courses!</p></div>`;
    return;
  }

  for(const course of available){
    const countRes     = await fetch(`${API}/enrollments/course/${course.id}/count`);
    const currentCount = countRes.ok ? await countRes.json() : 0;
    const placesLeft   = 3 - currentCount;
    const isFull       = currentCount >= 3;
    const pct          = Math.min(100, Math.round((currentCount/3)*100));
    const barCls       = pct >= 100 ? 'cf-red' : pct >= 67 ? 'cf-amber' : 'cf-green';

    const div = document.createElement("div");
    div.className = "course-card";
    div.innerHTML = `
      <div class="c-top">
        <span class="c-name">${course.title}</span>
        <span class="tag tag-cr">${course.credits} cr</span>
      </div>
      ${course.description ? `<div class="c-desc">${course.description}</div>` : ''}
      <div class="cap-bar-row">
        <span>Seats</span>
        <strong>${placesLeft} / 3 remaining</strong>
      </div>
      <div class="cap-track"><div class="cap-fill ${barCls}" style="width:${pct}%"></div></div>
      <div class="c-actions">
        ${!isFull
          ? `<button class="btn-enroll" onclick="enrollInCourse(${course.id})">Enroll →</button>`
          : `<span class="tag-full-inline">Course Full</span>`}
      </div>`;
    container.appendChild(div);
  }
}

function displayMyEnrollments(enrollments){
  const container = document.getElementById("myEnrollments");
  document.getElementById("cntEnrolled").textContent = enrollments.length;
  container.innerHTML = "";

  if(enrollments.length === 0){
    container.innerHTML = `<div class="empty"><span class="empty-icon">📌</span><p>No enrollments yet.<br>Select a course on the left.</p></div>`;
    return;
  }

  for(const en of enrollments){
    const courseName   = en.courseName || "Untitled Course";
    const enrollmentId = en.enrollmentId;
    const date         = new Date(en.date);

    const div = document.createElement("div");
    div.className = "course-card is-enrolled";
    div.innerHTML = `
      <div class="c-top">
        <span class="c-name">${courseName}</span>
        <span class="tag tag-ok">Active</span>
      </div>
      <div class="date-tag">
        Enrolled ${date.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}
        &nbsp;·&nbsp;
        ${date.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
      </div>
      <div class="c-actions">
        ${en.deletable
          ? `<button class="btn-cancel" onclick="cancelEnrollment(${enrollmentId})">Cancel enrollment</button>`
          : `<span class="tag-expired">⏰ Cancellation window closed</span>`}
      </div>`;
    container.appendChild(div);
  }
}

async function enrollInCourse(courseId) {
    if (!currentStudent) {
        alert("Please load your student data first");
        return;
    }

    try {
        const res = await fetch(`${API}/enrollments/enroll`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                studentId: currentStudent.id,
                courseId: courseId
            })
        });

        if (res.ok) {
            alert(`✅ Successfully enrolled in course!`);
            loadDashboard();
        } else {
            // Essayer de parser le JSON d'erreur
            let errorMessage = "";
            try {
                const errorJson = await res.json();
                errorMessage = errorJson.message || errorJson.error || JSON.stringify(errorJson);
            } catch(e) {
                errorMessage = await res.text();
            }
            
            console.log("Message d'erreur:", errorMessage);
            
            if (errorMessage.includes("already enrolled")) {
                alert("❌ You are already enrolled in this course!");
            } else if (errorMessage.includes("Course full")) {
                alert("❌ Course is full (max 3 students)!");
            } else {
                alert("❌ Enrollment failed: " + errorMessage);
            }
        }
    } catch (error) {
        alert("Network error: " + error.message);
    }
}
async function cancelEnrollment(enrollmentId){
  if(!confirm("Cancel this enrollment?")) return;
  try{
    const res = await fetch(`${API}/enrollments/${enrollmentId}`,{method:'DELETE'});
    if(res.ok){ loadDashboard(); }
    else{ const e=await res.text(); alert("Cancellation failed: "+e); }
  }catch(e){ alert("Network error: "+e.message); }
}

function showErr(msg){
  const el=document.getElementById("error");
  el.className="show"; el.textContent=msg;
}
function hideErr(){
  const el=document.getElementById("error");
  el.className=""; el.textContent="";
}
</script>
